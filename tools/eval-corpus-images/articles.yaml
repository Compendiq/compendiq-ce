# #1115 P5a — the curated article list for the German image-bearing eval corpus.
#
# Four content shapes, because a corpus made of one of them measures one of
# them. Each shape is a different bet about what a visual retrieval leg is for:
#
#   technical  engineering diagrams and schematics — layered stacks, cutaways,
#              circuit and network drawings. Mostly SVG upstream, vendored as
#              Wikimedia's PNG thumbnail rendering.
#   science    labelled scientific figures — cycles, anatomy, cross-sections.
#              The class where the picture carries information the prose states
#              nowhere.
#   process    organisational and process notation — flowcharts, lifecycle
#              diagrams, org charts, transit network maps. Shapes and arrows,
#              very little photographic texture.
#   photo      photographs of things and places — buildings, trains, aircraft.
#              The class an image encoder is best at and a text index worst at.
#
# Selection rule: an article qualifies only if it carries at least two captioned
# figures whose files pass the licence filter (CC0 / public domain / CC BY x /
# CC BY-SA x) and render to raster. `build.py --probe` reports that count per
# article without writing anything, and is how this list was pruned — every
# title below was probed, and the ones that came back with fewer than two
# usable figures were replaced rather than shipped thin.
#
# The probe count is an UPPER BOUND, not the number that ships. `build_page`
# returns before the thumbnail fetch and the re-encode under `--probe`, so
# `no thumbnail` and `cannot meet the byte cap` — the two rejections that can
# only be known by trying — have not run. An article probed at exactly two can
# therefore still build at one and be dropped; `--probe` prints `ok?` rather
# than `ok` for exactly that case.
#
# Probed and dropped, so nobody re-adds them expecting them to work:
# `Wasserfallmodell`, `Flussdiagramm`, `Kanban`, `Gantt-Diagramm`,
# `Fehlermöglichkeits- und Einflussanalyse` and `Wasserkreislauf` each came back
# with fewer than two usable figures — an article can be exactly the right
# subject and still carry one GFDL-only diagram and nothing else. The German
# flowchart article is `Programmablaufplan`, which does qualify, and stands in
# for `Flussdiagramm`.
#
# `Projektmanagement` joined them in review round 2. It shipped with two images
# and one of them, `File:Magischesdreieck.gif`, is credited on Commons to
# `unbekant` — a mistyped `unbekannt`, which the unknown-author filter did not
# recognise until the spelling was added to it. Without that image the article
# is a one-figure page, below the two-figure floor. It is a fair example of the
# selection rule doing its job rather than a gap to paper over: the subject is
# well covered by `Scrum`, `V-Modell` and `Demingkreis` in the same shape.
#
# Titles are German Wikipedia article titles, exactly as the API normalises
# them. Redirects ARE followed and the RESOLVED title is what lands in the
# manifest, so a few entries below appear under another name in the corpus
# (`Antenne` -> `Antenne (Technik)`, `Abgasturbolader` -> `Turbolader`,
# `Balanced Scorecard` -> its current title). The REVISION each article was taken at is not recorded here: it is
# recorded in the corpus's own MANIFEST.json, and `build.py` reads those pins
# back on a plain re-run (the `vendor-eval-corpus.ts` precedent), so rebuilding
# reproduces the committed bytes instead of tracking whatever the article says
# today. `--update` moves to current revisions, which obliges a re-label.


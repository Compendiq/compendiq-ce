name: PR Check

on:
  pull_request:
    branches: [dev, main]

# Cancel in-progress runs for the same PR — saves CI minutes on rapid pushes
concurrency:
  group: pr-check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  typecheck-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The runtime Docker stage copies only the root node_modules. If npm's
      # hoister demotes a backend prod dep to backend/node_modules (e.g.
      # because a root devDep chain pins a conflicting major), the dep
      # disappears at runtime and the container crash-loops on boot —
      # invisible to `npm run build` and to `docker build` alike. Simulate
      # the Docker prod-deps install in a tmpdir and assert the two
      # historically-fragile packages stay at the root.
      - name: Verify prod-deps hoist runtime-critical packages to root
        run: |
          set -euo pipefail
          T=$(mktemp -d)
          mkdir -p "$T/backend" "$T/packages/contracts" "$T/frontend"
          cp package.json package-lock.json "$T/"
          cp backend/package.json "$T/backend/"
          cp packages/contracts/package.json "$T/packages/contracts/"
          cp frontend/package.json "$T/frontend/"
          (cd "$T" && npm ci --omit=dev -w backend -w @compendiq/contracts >/dev/null)
          missing=()
          for pkg in p-limit ipaddr.js; do
            test -d "$T/node_modules/$pkg" || missing+=("$pkg")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Prod deps not hoisted to root node_modules: ${missing[*]}"
            echo "  These are listed in root package.json 'dependencies' so npm hoists them."
            echo "  See the //deps-note in package.json for context."
            exit 1
          fi
          echo "✓ p-limit + ipaddr.js hoisted to root node_modules"

      - name: Typecheck (contracts + backend + frontend)
        run: npm run typecheck

      - name: Lint (backend + frontend)
        run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kb_user
          POSTGRES_PASSWORD: changeme-postgres
          POSTGRES_DB: kb_creator_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kb_user -d kb_creator_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_TEST_URL: postgresql://kb_user:changeme-postgres@localhost:5433/kb_creator_test
      POSTGRES_URL: postgresql://kb_user:changeme-postgres@localhost:5433/kb_creator_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long
      PAT_ENCRYPTION_KEY: ci-test-encryption-key-at-least-32-chars

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run build -w @compendiq/contracts

      # Coverage stays on push to dev/main (coverage.yml). Instrumenting
      # every PR added ~minutes to the critical path for a floor that
      # barely moves on a typical change.
      - name: Backend tests
        run: npm test -w backend

      - name: Contracts tests
        run: npm test -w @compendiq/contracts

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test -w frontend

  # #1102 — retrieval quality gate. Deliberately its OWN job: it runs a real
  # embedding model, which the fast PR path must not wait on. Scoped by paths
  # so it only fires for changes that can actually move retrieval.
  retrieval-eval:
    name: Retrieval eval
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kb_user
          POSTGRES_PASSWORD: changeme-postgres
          POSTGRES_DB: kb_eval
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U kb_user -d kb_eval"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      POSTGRES_URL: postgresql://kb_user:changeme-postgres@localhost:5434/kb_eval
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long
      PAT_ENCRYPTION_KEY: ci-test-encryption-key-at-least-32-chars
      EVAL_EMBEDDING_BASE_URL: http://localhost:11434/v1
      EVAL_EMBEDDING_MODEL: nomic-embed-text

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # Everything below is skipped unless the PR touches something that can
      # actually move retrieval. Done here rather than with a workflow-level
      # `paths:` filter, which would gate every job in the file, and without a
      # third-party filter action.
      - name: Does this PR touch retrieval?
        id: scope
        run: |
          set -o pipefail
          BASE="origin/${{ github.base_ref || 'dev' }}"
          # NO `git fetch --depth=1` here: checkout already fetched full
          # history, and a shallow fetch would CUT the base's ancestry, making
          # the three-dot diff die with "no merge base". That error used to be
          # swallowed, leaving CHANGED empty and skipping the eval on a PR that
          # did touch retrieval — a green tick for a job that never ran
          # (review r1).
          if ! CHANGED=$(git diff --name-only "$BASE"...HEAD); then
            echo "Could not diff against $BASE — running the eval rather than skipping it."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # content-converter is in the list because the EMBEDDING INPUT goes
          # through it since #1265 (htmlToEmbeddingText / htmlToMarkdown) — a
          # turndown-rule change moves retrieval as surely as a rag-service one.
          if echo "$CHANGED" | grep -qE '^backend/src/domains/llm/(services/(rag-service|embedding-service|llm-provider-resolver)|eval/)|^backend/src/core/services/content-converter|^backend/scripts/run-retrieval-eval|^\.github/workflows/pr-check'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No retrieval-affecting paths changed — skipping the eval."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Build contracts
        if: steps.scope.outputs.run == 'true'
        run: npm run build -w @compendiq/contracts

      - name: Cache Ollama models
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/ollama-models
          key: ollama-nomic-embed-text-v1

      - name: Start Ollama
        if: steps.scope.outputs.run == 'true'
        run: |
          mkdir -p /tmp/ollama-models
          docker run -d --name ollama --network host -v /tmp/ollama-models:/root/.ollama ollama/ollama:latest

      # nomic-embed-text (~274 MB) rather than a smaller model: the corpus
      # chunks out at up to CHUNK_HARD_LIMIT (6000) characters, and all-minilm's
      # 256-token window silently embedded only the prefix — it returns
      # byte-identical vectors for two 5400-char texts differing in their last
      # word. assertModelReadsFullChunk fails the run if that recurs.
      - name: Pull the embedding model
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            curl -sf http://localhost:11434/api/version >/dev/null && break
            if [ "$i" = "60" ]; then echo "Ollama never became reachable"; exit 1; fi
            sleep 1
          done
          # `| tail -1` alone would mask a failed pull behind tail's exit code,
          # and the eval would then fail later with a confusing 404 (review r1).
          curl -sf -X POST http://localhost:11434/api/pull -d '{"name":"nomic-embed-text"}' -o /tmp/pull.log
          tail -1 /tmp/pull.log
          grep -q '"status":"success"' /tmp/pull.log

      - name: Run the retrieval eval
        if: steps.scope.outputs.run == 'true'
        run: npx tsx scripts/run-retrieval-eval.ts --out retrieval-eval.json
        working-directory: backend

      # The report is for READING a run, not as a --baseline for a local
      # candidate: the two sides would differ in machine and HNSW graph, which
      # is enough to move a query (review r4, and the runbook says the same).
      # To compare against dev, measure both sides in one environment.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.scope.outputs.run == 'true'
        with:
          name: retrieval-eval-report
          path: backend/retrieval-eval.json

  vl-embedding-shim:
    name: VL embedding shim (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # `tools/` is not an npm workspace, so `npm test` cannot reach this suite
      # and nothing else in this file runs Python — without this job the shim's
      # pytest exception to "Vitest everywhere" would also be an exception to
      # being run at all. Scoped in-job rather than with a workflow-level
      # `paths:` filter, which would gate every job in the file (same pattern
      # and same reasoning as `retrieval-eval` above).
      - name: Does this PR touch the shim?
        id: scope
        run: |
          set -o pipefail
          BASE="origin/${{ github.base_ref || 'dev' }}"
          if ! CHANGED=$(git diff --name-only "$BASE"...HEAD); then
            echo "Could not diff against $BASE — running the suite rather than skipping it."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$CHANGED" | grep -qE '^tools/vl-embedding-shim/|^\.github/workflows/pr-check'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "The shim was not touched — skipping its suite."
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: '3.12'

      # `.[dev]` only. The `[mlx]` extra is Apple-Silicon-only (mlx has no
      # Linux wheels), and the mlx backend's tests drive a fake encoder through
      # the library's `load()` seam, so they run here without it.
      - name: Install the shim
        if: steps.scope.outputs.run == 'true'
        working-directory: tools/vl-embedding-shim
        run: pip install -e '.[dev]'

      - name: pytest
        if: steps.scope.outputs.run == 'true'
        working-directory: tools/vl-embedding-shim
        run: python -m pytest -q

  mcp-docs:
    name: MCP Docs Sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-docs
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: mcp-docs/package-lock.json

      - name: Install MCP docs dependencies
        run: npm ci

      - name: Typecheck MCP docs
        run: npm run typecheck

      - name: Test MCP docs
        run: npm test

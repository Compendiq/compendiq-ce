name: Coverage

# The PR path runs tests without instrumentation (see pr-check.yml). This
# workflow is the remaining holder of the backend coverage floors
# (70/70/60/70 in backend/vitest.config.ts). Push-only so it cannot add
# wall-clock to a PR; cancel-in-progress so a burst of merges to dev
# does not stack full-suite coverage runs.
on:
  push:
    branches: [dev, main]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  backend-coverage:
    name: Backend coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kb_user
          POSTGRES_PASSWORD: changeme-postgres
          POSTGRES_DB: kb_creator_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kb_user -d kb_creator_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_TEST_URL: postgresql://kb_user:changeme-postgres@localhost:5433/kb_creator_test
      POSTGRES_URL: postgresql://kb_user:changeme-postgres@localhost:5433/kb_creator_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long
      PAT_ENCRYPTION_KEY: ci-test-encryption-key-at-least-32-chars

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run build -w @compendiq/contracts

      - name: Backend tests (with coverage)
        run: npm run test:coverage -w backend

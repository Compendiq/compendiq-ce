name: Docker Build & Push

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Rebuild an existing release tag (e.g. v0.9.1): checks out that tag's
          source, builds amd64 + arm64 natively and re-pushes its version tags.
          Empty = build the selected branch as usual.
        type: string
        default: ''
      images:
        description: Comma-separated images to build (backend, frontend, searxng, mcp-docs) or "all"
        type: string
        default: all

# Cancel in-progress runs for the same branch — saves CI minutes on rapid pushes.
# A tag rebuild dispatched from a branch gets its own group so it neither
# cancels nor is cancelled by that branch's pushes.
concurrency:
  group: docker-build-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed images
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      searxng: ${{ steps.filter.outputs.searxng }}
      mcp: ${{ steps.filter.outputs.mcp }}
      ref: ${{ steps.release.outputs.ref }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # release_tag != '' switches the image jobs to native amd64 + arm64
      # builds merged into one index. A pushed v* tag builds itself; the
      # `tag` dispatch input rebuilds an existing tag from any branch without
      # moving it. A rebuild only claims `latest` when it is the newest stable
      # tag, so rebuilding an old release cannot roll `latest` back.
      - name: Resolve release
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ref="" release_tag="" latest=auto
          if [ -n "$INPUT_TAG" ]; then
            if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag input '$INPUT_TAG' is not a vX.Y.Z release tag"
              exit 1
            fi
            if ! git rev-parse -q --verify "refs/tags/$INPUT_TAG^{commit}" >/dev/null; then
              echo "::error::tag $INPUT_TAG does not exist"
              exit 1
            fi
            newest=$(git tag -l 'v*' --sort=-v:refname | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed -n 1p)
            ref="refs/tags/$INPUT_TAG" release_tag="$INPUT_TAG"
            if [ "$INPUT_TAG" = "$newest" ]; then latest=true; else latest=false; fi
          elif [[ "$REF" == refs/tags/* ]]; then
            release_tag="$REF_NAME"
          fi
          {
            echo "ref=$ref"
            echo "release_tag=$release_tag"
            echo "latest=$latest"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Classify changed images
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          INPUT_IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          declare -A build=([backend]=false [frontend]=false [searxng]=false [mcp]=false)
          emit() {
            for name in backend frontend searxng mcp; do
              echo "$name=${build[$name]}" | tee -a "$GITHUB_OUTPUT"
            done
          }
          all_true() {
            for name in "${!build[@]}"; do build[$name]=true; done
            echo "Building all images."
          }
          ZERO="0000000000000000000000000000000000000000"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "${INPUT_IMAGES:-all}" = "all" ]; then
              all_true
            else
              for image in ${INPUT_IMAGES//,/ }; do
                case "$image" in
                  backend|frontend|searxng) build[$image]=true ;;
                  mcp-docs) build[mcp]=true ;;
                  *) echo "::error::unknown image '$image' in images input"; exit 1 ;;
                esac
              done
            fi
            emit
            exit 0
          fi
          if [[ "$REF" == refs/tags/* ]] || [ "$EVENT" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
            all_true
            emit
            exit 0
          fi
          if ! CHANGED=$(git diff --name-only "$BEFORE" "$SHA"); then
            echo "Could not diff $BEFORE..$SHA — building all images."
            all_true
            emit
            exit 0
          fi
          flag() {
            if echo "$CHANGED" | grep -qE "$2"; then build[$1]=true; fi
          }
          flag backend '^(backend/|packages/contracts/|package-lock\.json|package\.json$|\.dockerignore$|\.github/workflows/docker-(build|image)\.yml)'
          flag frontend '^(frontend/|packages/contracts/|package-lock\.json|package\.json$|build-info\.json$|\.dockerignore$|\.github/workflows/docker-(build|image)\.yml)'
          flag searxng '^(docker/searxng/|\.github/workflows/docker-(build|image)\.yml)'
          flag mcp '^(mcp-docs/|\.dockerignore$|\.github/workflows/docker-(build|image)\.yml)'
          emit

  # Each image job calls docker-image.yml: amd64-only on branch builds;
  # native amd64 + arm64 runners merged into one index on release builds.
  docker-backend:
    name: Backend Image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      image: compendiq-ce-backend
      context: .
      file: ./backend/Dockerfile
      ref: ${{ needs.changes.outputs.ref }}
      release_tag: ${{ needs.changes.outputs.release_tag }}
      latest: ${{ needs.changes.outputs.latest }}
      attest: true
      # Smoke-load the runtime image's prod node_modules on every built
      # architecture. Guards against the class of bug where npm's hoister
      # demotes a backend prod dep to `backend/node_modules/` — invisible to
      # the runtime stage unless that tree is merged onto `/app/node_modules`.
      # Builds succeed in that case; containers crash on boot. The
      # historically-hoisted four (`p-limit`, `ipaddr.js`, two OpenTelemetry
      # packages) are not sufficient: collab TipTap packages demote and
      # `collab-schema.js` imports them on boot.
      smoke_test: |
        docker run --rm --entrypoint node "$IMAGE" --input-type=module -e \
          "await import('p-limit'); await import('ipaddr.js'); await import('@opentelemetry/sdk-node'); await import('@opentelemetry/sdk-metrics'); await import('@tiptap/extension-code-block'); await import('@tiptap/extension-color'); await import('@tiptap/extension-text-style'); await import('@tiptap/y-tiptap'); await import('./dist/core/services/collab-schema.js'); console.log('runtime require smoke ok');"

  docker-frontend:
    name: Frontend Image
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      image: compendiq-ce-frontend
      context: .
      file: ./frontend/Dockerfile
      ref: ${{ needs.changes.outputs.ref }}
      release_tag: ${{ needs.changes.outputs.release_tag }}
      latest: ${{ needs.changes.outputs.latest }}
      attest: true
      stamp_build_info: true

  docker-searxng:
    name: SearXNG Image
    needs: changes
    if: needs.changes.outputs.searxng == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      image: compendiq-ce-searxng
      context: ./docker/searxng
      file: ./docker/searxng/Dockerfile
      ref: ${{ needs.changes.outputs.ref }}
      release_tag: ${{ needs.changes.outputs.release_tag }}
      latest: ${{ needs.changes.outputs.latest }}

  docker-mcp-docs:
    name: MCP Docs Image
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      image: compendiq-ce-mcp-docs
      context: .
      file: ./mcp-docs/Dockerfile
      ref: ${{ needs.changes.outputs.ref }}
      release_tag: ${{ needs.changes.outputs.release_tag }}
      latest: ${{ needs.changes.outputs.latest }}
      attest: true


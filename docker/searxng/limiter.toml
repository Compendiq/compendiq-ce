[botdetection]
ipv4_prefix = 32
ipv6_prefix = 48
# Trust only loopback by default. Direct Docker callers such as mcp-docs are
# clients, not proxies, and therefore do not need forwarded-IP headers.
trusted_proxies = [
  '127.0.0.0/8',
  '::1',
]

[botdetection.ip_limit]
filter_link_local = false
link_token = false

[botdetection.ip_lists]
pass_searxng_org = false

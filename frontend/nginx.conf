worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Add MIME type for PWA web manifest (not in default mime.types)
    types {
        application/manifest+json webmanifest;
    }
    server_tokens off;

    # Temp paths for non-root
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen 8081 default_server;
        listen [::]:8081 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers are defined in an external snippet and included per
        # location block. They are intentionally NOT set at the server level,
        # because nginx silently overrides server-context response headers
        # whenever any location block declares its own (CWE-16). See docs/
        # architecture/14-frontend-edge-and-runtime-config.md for the design.

        # Use Docker DNS resolver so nginx resolves "backend" at request time,
        # not startup. Prevents crash-loop when DNS isn't ready yet.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Single host:port source for the backend service. We use a per-server
        # `set $var ...;` rather than an http-context upstream block because
        # the OSS nginx upstream module resolves hostnames once at startup,
        # which defeats the runtime resolver pattern above (the `resolve`
        # keyword on upstream servers is nginx-plus only).
        set $backend_upstream http://backend:3051;

        # Collaborative editing WebSocket (#1446). Sibling of `/api/` so the
        # longer `^~` prefix wins regardless of source order. The generic
        # location is SSE-shaped (`proxy_buffering off`, 300s) and does not
        # Upgrade; putting Upgrade there would also stretch LLM streams to
        # an hour. Browsers' WebSocket() uses HTTP/1.1 Upgrade (RFC 6455),
        # not RFC 8441 Extended CONNECT — this edge listens HTTP/1.1 on
        # 8081, so the hop is already the right protocol.
        location ^~ /api/collab/ {
            include /etc/nginx/security-headers.conf;

            # nosemgrep: generic.nginx.security.missing-internal.missing-internal
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # API proxy — ^~ ensures this beats the static-asset regex below,
        # so requests like /api/attachments/…/image.png get proxied to the backend.
        #
        # The `missing-internal` semgrep rule is intentionally suppressed
        # below: this endpoint is public by design. It proxies to authenticated
        # backend routes (the backend's `fastify.authenticate` decorator
        # guards every protected route; public exceptions are limited to
        # /api/health and /api/auth/*). Marking the location `internal`
        # would block ALL client traffic to the API and break the app.
        location ^~ /api/ {
            include /etc/nginx/security-headers.conf;

            # Request-body ceiling for the API (#1178). Unset, nginx caps at
            # its 1 MB default and rejects anything larger with its own HTML
            # 413 — before Fastify sees the request, so none of the app's
            # error contract applies and none of the app's own limits are
            # reachable. A 1.2 MB Markdown import failed as
            # "Request Entity Too Large" from <center>nginx</center>, naming
            # nginx's rule rather than the app's.
            #
            # 44m must clear the LARGEST bodyLimit any route behind this
            # location declares, or the edge becomes the binding limit again
            # for that route and we are back to the same unreadable 413. Note
            # nginx's `m` suffix is binary, so 44m is 46,137,344 bytes:
            #
            #   confluence attachments PUT  bodyLimit 40 MiB = 41,943,040
            #   local attachments PUT       bodyLimit         35,000,000
            #   pages/import/preview        bodyLimit  8 MiB =  8,388,608
            #
            # Those are not theoretical. A local attachment at its own 25 MB
            # binary cap is 34,952,536 bytes once base64-encoded, and a draw.io
            # save carries a 10 MB PNG plus 25 MB of XML in one JSON body —
            # 40,195,416 bytes. Both exceed 30m, which is why this is not set
            # to the 30m that docs/integrations/reverse-proxy/nginx.md used to
            # recommend for the proxy in front of this one; that figure predates
            # the bodyLimit raises on the two attachment routes above and has
            # been corrected there to match. The Markdown import worst case
            # (~6 MB: a UTF-16 code unit costs up to 3 bytes of UTF-8, or 6 once
            # JSON-escaped) sits far below all of this.
            #
            # Scoped to this location on purpose: the SPA and static locations
            # accept no uploads and stay on the 1 MB default.
            #
            # The cost of the raise is that ANY caller — including one with no
            # token — can now make this edge buffer up to 44 MB before Fastify
            # sees the request. It is deliberately not narrowed to a nested
            # `location ^~ /api/auth/`, because that would close nothing:
            # nginx applies this limit by PATH and knows nothing about auth, so
            # a client refused 44 MB on /api/auth/login sends it to /api/pages
            # instead and the edge buffers it just the same. The exposure is a
            # property of the location, not of the routes inside it.
            #
            # What bounds it is that nginx spools to client_body_temp_path
            # rather than memory, and that @fastify/rate-limit is global — so
            # the cost is bandwidth and scratch disk, at a rate-limited request
            # count. Narrowing it for real means a body limit that varies with
            # authentication, which nginx cannot express; it belongs in front
            # of the edge (WAF, or the operator's own proxy) if it is wanted.
            client_max_body_size 44m;

            # nosemgrep: generic.nginx.security.missing-internal.missing-internal
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support — disable buffering for streaming LLM responses
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300;
        }

        # Health proxy — public liveness/readiness endpoint for orchestrators
        # (docker healthcheck, k8s probes, uptime monitors). Returns the
        # backend's /health JSON without auth so probes can reach it. Public
        # by design; same rationale as the /api/ block above — see the
        # `missing-internal` suppression note there.
        location /health {
            include /etc/nginx/security-headers.conf;
            # nosemgrep: generic.nginx.security.missing-internal.missing-internal
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
        }

        # Draw.io self-hosted diagram editor — static files served with long cache.
        # The draw.io webapp is a client-side app; after initial load, all editing
        # happens in the browser via postMessage (no server round-trips).
        location ^~ /drawio/ {
            include /etc/nginx/security-headers.conf;
            include /etc/nginx/cache-drawio.conf;
            alias /usr/share/nginx/html/drawio/;
        }

        # index.html must never be cached — it contains the chunk filenames for the
        # current build. After a deployment, browsers must fetch fresh index.html
        # so lazy-loaded chunks resolve to the new hashed URLs.
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            include /etc/nginx/cache-nocache.conf;
        }

        # Static assets with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webmanifest)$ {
            include /etc/nginx/security-headers.conf;
            include /etc/nginx/cache-immutable.conf;
        }

        # SPA fallback
        location / {
            include /etc/nginx/security-headers.conf;
            try_files $uri $uri/ /index.html;
        }
    }
}

<!doctype html>
<html lang="en" data-theme="graphite" data-theme-type="dark" data-font="inter" data-font-scope="application" data-dyslexia-spacing="false" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compendiq</title>
    <meta name="description" content="AI-powered knowledge base management with Confluence integration, RAG-powered Q&A, and local Ollama LLM backend." />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Browser chrome (mobile address bar / PWA surround) blends with the page
         surface, so these are the theme BACKGROUNDS, not the accent. -->
    <meta name="theme-color" content="#09090a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ebeae8" media="(prefers-color-scheme: light)" />

    <!--
      Open Graph — og:image MUST be an absolute URL for social scrapers.
      Self-hosted deployments: replace the origin below with your actual domain.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Compendiq" />
    <meta property="og:description" content="AI-powered knowledge base management with Confluence integration, RAG-powered Q&A, and local Ollama LLM backend." />
    <meta property="og:image" content="https://compendiq.io/favicon-512.png" />
    <meta property="og:site_name" content="Compendiq" />

    <!-- Twitter/X falls back to og:* tags; only twitter:card is needed -->
    <meta name="twitter:card" content="summary" />

    <script>
      // Prevent FOUC: read persisted theme before React loads and apply
      // data-theme + data-theme-type + the `dark` class together. Doing all
      // three before first paint keeps Tailwind's `dark:` variants (e.g. the
      // header logo's `dark:invert`) and the `[data-theme-type]` CSS rules in
      // lockstep — no flash of dark-on-dark or light-on-light at boot.
      // Only the two current themes are honored; unknown values fall through
      // to the defaults already set on <html> above. Legacy localStorage keys
      // are still checked so upgrading users keep their preference.
      //
      // RETIRED maps superseded theme IDs onto their replacement BEFORE first
      // paint. Without it, a user still holding `honey-linen` would paint dark
      // (the <html> default), then get corrected to Frost Steel a frame later
      // when the store rehydrates — a full-brightness light-on-dark flash.
      // Keep this table in sync with RETIRED_LIGHT_THEME_IDS in
      // src/stores/theme-store.ts, which does the same remap for the store.
      (function() {
        var DARK = 'graphite', LIGHT = 'paper';
        var DEFAULT_FONT = 'inter', DEFAULT_SCOPE = 'application';
        var FONTS = {
          'inter': 1, 'opendyslexic-alta': 1, 'atkinson': 1, 'system': 1, 'serif': 1
        };
        var SCOPES = { 'application': 1, 'reading-pane': 1 };
        // Superseded palette IDs, mapped onto the light/dark side they were on
        // so an upgrading user paints the right BRIGHTNESS at first frame.
        var RETIRED_LIGHT = {
          'honey-linen': 1, 'polar-slate': 1, 'parchment-glow': 1,
          'sunrise-cream': 1, 'cloud-white': 1, 'frost-steel': 1
        };

        function apply(theme) {
          var isLight = theme === LIGHT;
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.dataset.themeType = isLight ? 'light' : 'dark';
          document.documentElement.classList.toggle('dark', !isLight);
        }

        function applyTypography(state) {
          var font = state && FONTS[state.fontFamily] ? state.fontFamily : DEFAULT_FONT;
          var scope = state && SCOPES[state.fontScope] ? state.fontScope : DEFAULT_SCOPE;
          document.documentElement.setAttribute('data-font', font);
          document.documentElement.setAttribute('data-font-scope', scope);
          document.documentElement.setAttribute(
            'data-dyslexia-spacing',
            state && state.dyslexiaSpacing === true ? 'true' : 'false'
          );
        }

        function systemTheme() {
          try {
            return window.matchMedia('(prefers-color-scheme: light)').matches ? LIGHT : DARK;
          } catch (e) { return DARK; }
        }

        try {
          var raw = localStorage.getItem('compendiq-theme')
                  || localStorage.getItem('atlasmind-theme')
                  || localStorage.getItem('kb-theme');
          var state = raw ? (JSON.parse(raw) || {}).state : null;
          applyTypography(state);

          // Current shape: { preference: 'system' | 'dark' | 'light' }.
          var preference = state && state.preference;
          if (preference === 'dark') return apply(DARK);
          if (preference === 'light') return apply(LIGHT);
          if (preference === 'system') return apply(systemTheme());

          // Legacy shape: { theme: '<palette id>' }, written before the
          // preference split. A user who explicitly picked a palette under the
          // old system kept a fixed choice, so honour its brightness rather
          // than silently converting them to `system`; the store's rehydrate
          // does the matching remap.
          var legacy = state && state.theme;
          if (legacy) return apply(RETIRED_LIGHT[legacy] || legacy === LIGHT ? LIGHT : DARK);

          // Nothing stored: brand-new user, and the default is `system`.
          apply(systemTheme());
        } catch (e) {
          apply(DARK);
        }
      })();
    </script>
    <style>
      /* First-paint chassis. React replaces #root on mount. Hex fallbacks
         cover the gap before index.css defines the theme tokens. No extra
         inline script — CSP hashes only the FOUC theme block above. */
      #boot-shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        background: var(--app-chassis, #09090a);
        pointer-events: none;
      }
      html:not(.dark) #boot-shell { background: var(--app-chassis, #ebeae8); }
      .boot-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .boot-header {
        display: flex;
        align-items: center;
        height: 2.75rem;
        min-height: 2.75rem;
        padding: 0 12px;
        flex-shrink: 0;
      }
      .boot-header img { height: 24px; width: auto; }
      @media (min-width: 768px) {
        .boot-header { padding-left: 24px; }
      }
    </style>
  </head>
  <!-- Background comes from index.css's `body { background: var(--surface-backdrop) }`,
       which is now a flat colour. A `bg-background` utility here would be
       redundant rather than harmful, but keeping the paint in one place means
       first paint and post-hydration cannot disagree. -->
  <body class="h-screen overflow-hidden text-foreground antialiased">
    <div id="root">
      <div id="boot-shell" role="status" aria-live="polite" aria-busy="true">
        <span class="boot-sr">Loading Compendiq</span>
        <div class="boot-header">
          <img src="/favicon.svg" alt="Compendiq" width="24" height="24" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
